name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Exercise built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help

  quality:
    name: Quality, docs, example, and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Build docs
        run: pnpm run docs:build

      - name: Build example
        run: pnpm --filter aisdk-dt-example-chatbot run build

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Test packed package
        run: pnpm run build && pnpm run test:package

      - name: Check package contents
        run: pnpm pack --dry-run

      - name: Create runtime artifact
        run: pnpm pack --pack-destination artifacts

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: artifacts/*.tgz

      - name: Check whitespace
        run: git diff --check

  runtime-node-20:
    name: Packed CLI runtime (Node 20)
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Set Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: package

      - name: Install and exercise packed CLI
        run: |
          mkdir consumer
          cd consumer
          npm init --yes
          npm install --ignore-scripts ../package/*.tgz
          npx --no-install aisdk-dt --version
          npx --no-install aisdk-dt --help
