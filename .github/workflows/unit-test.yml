name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Exercise built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help

  quality:
    name: Quality, docs, example, and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Build docs
        run: pnpm run docs:build

      - name: Build example
        run: pnpm --filter aisdk-dt-example-chatbot run build

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Test packed package
        run: pnpm run build && pnpm run test:package

      - name: Check package contents
        run: pnpm pack --dry-run

      - name: Check whitespace
        run: git diff --check
